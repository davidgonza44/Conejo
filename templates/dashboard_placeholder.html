{% extends "base_auth.html" %}

{% block title %}Dashboard — Ferretería El Conejo{% endblock %}

{% block content %}
<div class="page page-center">
    <div class="container container-tight py-4">
        <div class="card card-md">
            <div class="card-body text-center">
                <i class="ti ti-circle-check text-green" style="font-size: 3rem;"></i>
                <h2 class="h2 mt-3">Sesión iniciada correctamente. Dashboard pendiente.</h2>
                <p class="text-secondary mb-4">
                    Usuario: <strong>{{ current_user.name }}</strong> ({{ current_user.username }})<br>
                    Rol: <span class="badge bg-blue text-blue-fg">{{ current_user.role }}</span>
                </p>
                <button type="button" class="btn btn-danger" onclick="logout()">
                    <i class="ti ti-logout me-2"></i>Cerrar sesión
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
