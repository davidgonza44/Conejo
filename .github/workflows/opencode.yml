name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Trusted commenters only: both comment events can be created by anyone on
    # a public repo, and this job receives OPENCODE_API_KEY plus the OIDC
    # capability. OWNER/MEMBER/COLLABORATOR covers the owner and granted
    # collaborators; outsiders and bots (NONE) can no longer launch the agent.
    # Command-boundary matching: no regex in expressions, so toJSON() renders
    # tab/newline/CR as the two-char sequences \t \n \r, which match the
    # literals below; padding unifies start/end of comment with space.
    # Longer tokens such as /occlusion or /opencode-config never match.
    if: |
      (contains(toJSON(format(' {0} ', github.event.comment.body)), ' /oc ') ||
      contains(toJSON(format(' {0} ', github.event.comment.body)), ' /oc\n') ||
      contains(toJSON(format(' {0} ', github.event.comment.body)), ' /oc\t') ||
      contains(toJSON(format(' {0} ', github.event.comment.body)), ' /oc\r') ||
      contains(toJSON(format(' {0} ', github.event.comment.body)), ' /opencode ') ||
      contains(toJSON(format(' {0} ', github.event.comment.body)), ' /opencode\n') ||
      contains(toJSON(format(' {0} ', github.event.comment.body)), ' /opencode\t') ||
      contains(toJSON(format(' {0} ', github.event.comment.body)), ' /opencode\r')) &&
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        # Pinned to what refs/tags/latest resolved to on 2026-09-04
        # (chore: remove dead code for todoread tool (#19128)).
        # Bump deliberately after review; never back to a floating ref.
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/muse-spark-1.3-contributor-free